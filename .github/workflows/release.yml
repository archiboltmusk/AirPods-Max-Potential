name: Automated Release (DMG & ZIP)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. 1.3.0)'
        required: true
        default: '1.3.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish macOS Release
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Display Xcode & Swift Version
        run: |
          xcodebuild -version
          swift --version

      - name: Compile Universal 2 Binary & Package Distribution Artifacts
        id: build
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "Building version $VERSION"
          chmod +x build_app.sh
          ./build_app.sh "$VERSION"

      - name: Publish Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AirPodsPosture-*.dmg
            AirPodsPosture-*.zip
            SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
