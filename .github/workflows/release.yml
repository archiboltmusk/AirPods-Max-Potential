name: Automated Release (DMG & ZIP)

on:
  push:
    branches: [main]
    paths: ['VERSION']
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. 1.3.0)'
        required: true
        default: '1.3.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish macOS Release
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Display Xcode & Swift Version
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            version="$REQUESTED_VERSION"
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cat VERSION)"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must be a numeric major.minor.patch version"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v$version" &&
             [[ "$(git rev-list -n 1 "refs/tags/v$version")" != "$GITHUB_SHA" ]]; then
            echo "::error::v$version already points to a different commit"
            exit 1
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"

      - name: Compile Universal 2 Binary & Package Distribution Artifacts
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          chmod +x build_app.sh
          ./build_app.sh "$RELEASE_VERSION"
          codesign --verify --verbose AirPodsPosture.app
          test -s AirPodsPosture.app/Contents/Resources/human_head.obj
          shasum -a 256 -c SHA256SUMS.txt

      - name: Publish Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.number }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            AirPodsPosture-v${{ steps.version.outputs.number }}-macOS.dmg
            AirPodsPosture-v${{ steps.version.outputs.number }}-macOS.zip
            SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
